name: Visual audit (emulator)
on:
  push:
    branches: [audit-run]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: new }
      - uses: actions/checkout@v4
        with: { ref: rollback/pre-quality-pass, path: old }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build current and pre-quality APKs
        run: |
          (cd new && gradle :app:assembleDebug -q) && cp new/app/build/outputs/apk/debug/app-debug.apk new.apk
          (cd old && gradle :app:assembleDebug -q) && cp old/app/build/outputs/apk/debug/app-debug.apk old.apk
          ls -la *.apk
      - name: Mock provider + test clip
        run: |
          pip install pillow numpy -q
          mkdir -p /tmp/media
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=440 -t 25 -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart /tmp/media/test.mp4
          ffmpeg -loglevel error -i /tmp/media/test.mp4 -c copy -f mpegts /tmp/media/test.ts
          nohup python3 tools/audit/mock_server.py 8080 /tmp/media > /tmp/mock.log 2>&1 &
          sleep 2; curl -s "localhost:8080/player_api.php?username=u&password=p"
      - name: Run emulator audit
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 3072M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            bash tools/audit/run.sh new.apk out/new_320 320
            bash tools/audit/run.sh old.apk out/old_320 320
            bash tools/audit/run.sh new.apk out/new_213 213
      - name: Publish results to branch audit-results
        if: always()
        run: |
          mkdir -p /tmp/res && cp -r out /tmp/res/ 2>/dev/null || true
          cd /tmp/res && for f in $(find out -name '*.mp4'); do ffmpeg -loglevel error -y -i $f -vf scale=960:-2 -crf 30 -an ${f%.mp4}_small.mp4 && rm $f; done
          git init -q -b audit-results && git config user.email ci@example.com && git config user.name ci
          cp /tmp/mock.log . 2>/dev/null || true
          git add -A && git commit -qm "audit results ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" audit-results
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: audit-out, path: out }
