name: Build AURORA TV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - run: gradle :app:assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk AuroraTV.apk
      - uses: actions/upload-artifact@v4
        with: { name: AuroraTV-apk, path: AuroraTV.apk }
      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: AURORA TV (latest build)
          files: AuroraTV.apk
          make_latest: true
