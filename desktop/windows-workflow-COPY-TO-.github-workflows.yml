name: Build 91 TV (Windows)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build (EXE + self-test + ZIP + installer)
        shell: pwsh
        run: ./build.ps1 -CI
      - uses: actions/upload-artifact@v4
        with:
          name: 91TV-windows
          path: release/*
      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: 91 TV for Windows (latest build)
          files: release/*
          make_latest: true
